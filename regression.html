<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CHEAV 回归测试台 — 自由连字</title>
<style>
    body { font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; margin: 14px; color: #222; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .hint { color: #666; margin-bottom: 10px; font-size: 12px; }
    #summary { padding: 8px 12px; border-radius: 4px; font-weight: 600; margin-bottom: 10px; }
    .ok { background: #d7f5d7; color: #14561a; }
    .bad { background: #ffe0e0; color: #8a1c1c; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; vertical-align: top; }
    th { background: #f2f2f2; }
    td.cell { text-align: center; width: 200px; background: #fafafa; }
    .stage { display: inline-block; font-size: 110px; line-height: 1.3; }
    .stage .hie { outline: 1px solid rgba(220,0,0,.45); }
    .pass { color: #14561a; font-weight: 600; }
    .fail { color: #a11; font-weight: 600; }
    .num { font-family: Consolas, monospace; font-size: 12px; color: #444; }
</style>
</head>
<body>
<h1>CHEAV 回归测试台 — 自由连字</h1>
<div class="hint">
    判据来自与 JSesh 的逐像素对照（参考图见仓库 <code>img/</code>）。<br>
    红框 = 字形墨迹盒。全部 PASS 才算没有回归。
</div>
<div id="summary">运行中…</div>
<table>
    <thead><tr><th style="width:220px">用例</th><th>渲染</th><th>检查项与实测值</th><th style="width:66px">结果</th></tr></thead>
    <tbody id="tbody"></tbody>
</table>

<script src="js/lib/paper-core.min.js?v=154516"></script>
<script src="js/database/mainSigns.js?v=154516"></script>
<script src="js/database/translit.js?v=154516"></script>
<script src="js/database/glyphZones.js?v=154516"></script>
<script src="js/database/serekhTail.js?v=154516"></script>
<script src="js/database/mdcGlyphTables.js?v=154516"></script>
<script src="js/plugin/mdcEncoding.js?v=154516"></script>
<script src="js/plugin/mdcMetrics.js?v=154516"></script>
<script src="js/plugin/mdcView.js?v=154516"></script>
<script src="js/plugin/mdcEnclosure.js?v=154516"></script>
<script src="js/plugin/mdcVrg.js?v=154516"></script>
<script src="js/plugin/mdcGlyphCore.js?v=154516"></script>
<script src="js/plugin/MdCRndr.js?v=154516"></script>
<script src="js/ui/glyphs.js?v=154516"></script>
<script>
(async function () {
    "use strict";
    var EM = 110;
    var rows = [];

    function add(name, text, checks) { rows.push({ name: name, text: text, checks: checks }); }

    // —— 判据 ——
    // parts: [{code,left,top,w,h}]
    add("b&D28（无槽 → 重叠于原点）", "b&D28", [
        { label: "两个部件都是原尺寸（宽高与单独渲染一致，±8%）", test: function (p, ref) {
            if (p.length < 2) return { ok: false, value: "部件数 " + p.length };
            var a = p[0].w / ref[0].w, b = p[1].w / ref[1].w;
            return { ok: Math.abs(a - 1) <= 0.08 && Math.abs(b - 1) <= 0.08, value: "比例 " + a.toFixed(2) + " / " + b.toFixed(2) };
        }},
        { label: "两者水平中线接近（重叠，允许 ≤0.35em 偏移）", test: function (p) {
            if (p.length < 2) return { ok: false, value: "-" };
            var d = Math.abs((p[0].left + p[0].w / 2) - (p[1].left + p[1].w / 2)) / EM;
            return { ok: d <= 0.35, value: d.toFixed(3) + " em" };
        }}
    ]);

    add("D28&b（宿主=b，双臂进左槽）", "D28&b", [
        // 源码：subView(1)=b 更高 → 宿主 = b，位置 0（左槽）；D28 按 scaleToFit 缩到 ~0.78
        { label: "宿主 b 保持原尺寸（±8%）", test: function (p, ref) {
            if (p.length < 2) return { ok: false, value: "部件数 " + p.length };
            var host = p[1].w / ref[0].w;          // ref[0] = 单独渲染的 b
            return { ok: Math.abs(host - 1) <= 0.08, value: host.toFixed(2) };
        }},
        { label: "D28 被缩放进左槽（0.70–1.05）", test: function (p, ref) {
            if (p.length < 2) return { ok: false, value: "-" };
            var k = p[0].w / ref[1].w;             // ref[1] = 单独渲染的 D28
            return { ok: k >= 0.70 && k <= 1.05, value: k.toFixed(2) };
        }}
    ]);

    add("w&t（面包右上）", "w&t", [
        { label: "面包在宿主右半侧", test: function (p) {
            if (p.length < 2) return { ok: false, value: "-" };
            var mb = p[1].left + p[1].w / 2, mh = p[0].left + p[0].w / 2;
            return { ok: mb > mh, value: ((mb - mh) / p[0].w).toFixed(3) };
        }},
        { label: "面包接近宿主顶部（差 ≤0.20 em）", test: function (p) {
            if (p.length < 2) return { ok: false, value: "-" };
            var d = Math.abs(p[1].top - p[0].top) / EM;
            return { ok: d <= 0.20, value: d.toFixed(3) + " em" };
        }}
    ]);

    add("t&D（面包在左、原尺寸）", "t&D", [
        { label: "面包宽度 / 宿主宽度 ≈ 0.52（±0.10）", test: function (p) {
            if (p.length < 2) return { ok: false, value: "-" };
            var r = p[1].w / p[0].w;
            return { ok: Math.abs(r - 0.52) <= 0.10, value: r.toFixed(3) };
        }},
        { label: "面包中线在宿主中线左侧", test: function (p) {
            if (p.length < 2) return { ok: false, value: "-" };
            var mb = p[1].left + p[1].w / 2, mh = p[0].left + p[0].w / 2;
            return { ok: mb < mh, value: ((mb - mh) / p[0].w).toFixed(3) };
        }}
    ]);

    add("zA&ra（太阳右上贴顶）", "zA&ra", [
        { label: "太阳顶与宿主顶齐平（≤0.05 em）", test: function (p) {
            if (p.length < 2) return { ok: false, value: "-" };
            var d = Math.abs(p[1].top - p[0].top) / EM;
            return { ok: d <= 0.05, value: d.toFixed(3) + " em" };
        }},
        { label: "太阳左缘 / 宿主宽 ≈ 0.58（±0.08）", test: function (p) {
            if (p.length < 2) return { ok: false, value: "-" };
            var r = (p[1].left - p[0].left) / p[0].w;
            return { ok: Math.abs(r - 0.58) <= 0.08, value: r.toFixed(3) };
        }}
    ]);

    // 判据来自 JSesh：Layout.visitCartouche（横排）
    //   框宽 = 内容宽 + dLong(起始端 10/18) + 结束端(11/18)
    //   框高 = max(内容高 + 2*dSmall, 1em + 2*dSmall)，dSmall = 3/18
    //   内容落在 (dLong, dSmall)
    add("<-Z4->（王名框几何 = visitCartouche）", "<-Z4->", [
        { label: "框高 = max(内容高+1/3, 4/3) em（±0.02）", test: function (p, ref, root) {
            var box = root.querySelector(".enc-js");
            if (!box || !p.length) return { ok: false, value: "无框" };
            var top = Math.min.apply(null, p.map(function (x) { return x.top; }));
            var bot = Math.max.apply(null, p.map(function (x) { return x.top + x.h; }));
            var contentH = (bot - top) / EM;
            var want = Math.max(contentH + 6 / 18, 1 + 6 / 18);
            var got = box.getBoundingClientRect().height / EM;
            return { ok: Math.abs(got - want) <= 0.02, value: got.toFixed(3) + " em（应 " + want.toFixed(3) + "）" };
        }},
        { label: "框宽 = 内容宽 + 21/18 em（±0.02）", test: function (p, ref, root) {
            var box = root.querySelector(".enc-js");
            if (!box || !p.length) return { ok: false, value: "无框" };
            var left = Math.min.apply(null, p.map(function (x) { return x.left; }));
            var right = Math.max.apply(null, p.map(function (x) { return x.left + x.w; }));
            var contentW = (right - left) / EM;
            var want = contentW + 21 / 18;
            var got = box.getBoundingClientRect().width / EM;
            return { ok: Math.abs(got - want) <= 0.02, value: got.toFixed(3) + " em（应 " + want.toFixed(3) + "）" };
        }},
        { label: "内容在框内上下居中（|上−下| ≤ 0.02em）", test: function (p, ref, root) {
            var box = root.querySelector(".enc-js");
            if (!box || !p.length) return { ok: false, value: "无框" };
            var rb = box.getBoundingClientRect();
            var top = Math.min.apply(null, p.map(function (x) { return x.top; }));
            var bot = Math.max.apply(null, p.map(function (x) { return x.top + x.h; }));
            var d = Math.abs((top - rb.top) - (rb.bottom - bot)) / EM;
            return { ok: d <= 0.02, value: d.toFixed(3) + " em" };
        }}
    ]);

    // —— 执行 ——
    var tbody = document.getElementById("tbody");
    var pass = 0, total = 0;

    try {
        await Glyphs.useSiteDir();
        Glyphs.setRenderer(MdCRndr);
        Glyphs.setEnabled(true);
        MdCRndr.setGlyphZoneProvider(function (c) { return Glyphs.zoneFor(c); });
        MdCRndr.setGlyphMetricsProvider(function (c) { return Glyphs.metrics(c); });
        MdCRndr.setGlyphBoxProvider(function (c) { return Glyphs.box(c); });
        MdCRndr.setGlyphAspectProvider(function (c) { return Glyphs.aspect(c); });
        MdCRndr.setQuadratMode("flow");
        await Glyphs.preload(["D58", "D28", "G43", "X1", "G39", "N5", "Z4"]);
        await new Promise(function (r) { setTimeout(r, 500); });

        function measure(root) {
            return Array.prototype.slice.call(root.querySelectorAll(".hie")).map(function (el) {
                var b = el.getBoundingClientRect();
                return { code: el.title, left: b.left, top: b.top, w: b.width, h: b.height };
            }).filter(function (x) { return x.w > 0 || x.h > 0; });
        }

        // 参考尺寸：b / D28 单独渲染
        var refHold = document.createElement("div");
        refHold.style.cssText = "position:absolute;left:-99999px;top:0";
        document.body.appendChild(refHold);
        var refCell = document.createElement("span");
        refCell.className = "stage";
        refHold.appendChild(refCell);
        var ref = {};
        ["b", "D28"].forEach(function (code) {
            refCell.textContent = "";
            MdCRndr.renderText(refCell, code, EM);
            var m = measure(refCell);
            ref[code] = m[0] || { w: 1, h: 1 };
        });

        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var tr = document.createElement("tr");

            var td1 = document.createElement("td");
            td1.innerHTML = "<b>" + row.name + "</b><br><span class='num'>" +
                row.text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
            tr.appendChild(td1);

            var cell = document.createElement("span");
            cell.className = "stage";
            MdCRndr.renderText(cell, row.text, EM);
            var td2 = document.createElement("td");
            td2.className = "cell";
            td2.appendChild(cell);
            tr.appendChild(td2);

            var td3 = document.createElement("td");
            tr.appendChild(td3);
            var td4 = document.createElement("td");
            tr.appendChild(td4);

            // 先入 DOM 再测量（否则 getBoundingClientRect 全为 0）
            tbody.appendChild(tr);
            void cell.offsetHeight;

            var p = measure(cell);
            var refArr = [ref["b"] || p[0], ref["D28"] || p[1]];
            var okAll = true;
            for (var k = 0; k < row.checks.length; k++) {
                var res;
                try { res = row.checks[k].test(p, refArr, cell); }
                catch (e) { res = { ok: false, value: "异常 " + e.message }; }
                total++; if (res.ok) pass++; else okAll = false;
                var d = document.createElement("div");
                d.innerHTML = "<span class='" + (res.ok ? "pass" : "fail") + "'>" +
                    (res.ok ? "PASS" : "FAIL") + "</span> " + row.checks[k].label +
                    " <span class='num'>→ " + res.value + "</span>";
                td3.appendChild(d);
            }
            td4.innerHTML = "<span class='" + (okAll ? "pass" : "fail") + "'>" + (okAll ? "PASS" : "FAIL") + "</span>";
        }
        var sum = document.getElementById("summary");
        sum.className = (pass === total) ? "ok" : "bad";
        sum.textContent = "判据通过 " + pass + " / " + total + (pass === total ? "　全部通过 ✅" : "　存在失败项 ❌");
    } catch (e) {
        var s2 = document.getElementById("summary");
        s2.className = "bad";
        s2.textContent = "运行出错：" + e.message + "\n" + (e.stack || "");
    }
})();
</script>
</body>
</html>
