<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CHEAV 连字结构检查台</title>
<style>
    body { font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; margin: 14px; color: #222; }
    h1 { font-size: 17px; margin: 0 0 6px; }
    .hint { color: #666; margin-bottom: 10px; font-size: 12px; }
    #log { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap;
           background: #ffef9f; padding: 8px; margin-bottom: 10px; min-height: 1.5em; }
    #stage { position: relative; font-size: 200px; line-height: 1.3; }
    #stage .hie { outline: 1.5px solid #e33; outline-offset: 0; }
    #stage .lig { outline: 1.5px dashed #08a; }
    #stage .zonebox { position: absolute; border: 1.5px solid #0a0; pointer-events: none; }
    #stage .zonebox.z2 { border-color: #e90; }
    #stage .zonebox.zB { border-color: #90c; }
</style>
</head>
<body>
<h1>CHEAV 连字结构检查台</h1>
<div class="hint">
    输入 MdC 串（如 <code>b&amp;D28</code>、<code>zA&amp;ra</code>、<code>t&amp;w&amp;t</code>）：<br>
    <b>红实线</b> = 字形墨迹盒；<b>蓝虚线</b> = 连字容器；<b>绿/橙/紫</b> = 宿主的三槽（zone1 / zone2 / zoneB）。
</div>
<input id="in" value="b&amp;D28" style="font-size:16px;padding:4px 8px;width:360px">
<button id="go" style="font-size:16px;padding:4px 12px">渲染</button>
<div id="log">等待渲染…</div>
<div id="stage"></div>

<script src="../js/database/mainSigns.js"></script>
<script src="../js/database/translit.js"></script>
<script src="../js/database/glyphZones.js"></script>
<script src="../js/database/serekhTail.js"></script>
<script src="../js/plugin/MdCRndr.js"></script>
<script src="../js/ui/glyphs.js"></script>
<script>
(function () {
    "use strict";
    var stage = document.getElementById("stage");
    var log = document.getElementById("log");
    var input = document.getElementById("in");
    var ready = false;

    // 1) 同步渲染（字形按时加载，先出结构再看框）
    function renderNow() {
        stage.textContent = "";
        MdCRndr.renderText(stage, input.value || "b&D28", 200);
        setTimeout(overlay, 400);        // 等一帧再画框
    }

    // 2) 叠加调试框
    function overlay() {
        var lines = [];
        Array.prototype.slice.call(stage.querySelectorAll(".zonebox")).forEach(function (b) { b.remove(); });

        var lig = stage.querySelector(".lig");
        if (lig) {
            var rl = lig.getBoundingClientRect();
            lines.push("连字容器  " + Math.round(rl.width) + " × " + Math.round(rl.height) + "px");
        }
        var glyphs = Array.prototype.slice.call(stage.querySelectorAll(".hie"));
        glyphs.forEach(function (el) {
            var b = el.getBoundingClientRect();
            lines.push("字形 " + (el.title || "?") + "  " +
                Math.round(b.width) + " × " + Math.round(b.height) + "px" +
                "   左偏移=" + Math.round(b.left) + "  底=" + Math.round(b.bottom));
        });

        // 宿主 = 第一个字形；画它的三槽
        if (glyphs.length && typeof Glyphs !== "undefined" && Glyphs.zoneFor) {
            var host = glyphs[0];
            var code = (host.title || "").split("（")[0];
            var z = null;
            try { z = Glyphs.zoneFor(code); } catch (e) { lines.push("zoneFor 出错：" + e.message); }
            var hb = host.getBoundingClientRect();
            var sb = stage.getBoundingClientRect();
            if (z) {
                [["zone1", "z1"], ["zone2", "z2"], ["zoneB", "zB"]].forEach(function (pair) {
                    var zz = z[pair[0]];
                    if (!zz) { lines.push("槽 " + pair[0] + " = 无"); return; }
                    var box = document.createElement("div");
                    box.className = "zonebox " + pair[1];
                    box.style.left = (hb.left - sb.left + zz.x * hb.width) + "px";
                    box.style.top = (hb.top - sb.top + zz.y * hb.height) + "px";
                    box.style.width = (zz.w * hb.width) + "px";
                    box.style.height = (zz.h * hb.height) + "px";
                    stage.appendChild(box);
                    lines.push("槽 " + pair[0] + "  x=" + zz.x.toFixed(3) + " y=" + zz.y.toFixed(3) +
                        " w=" + zz.w.toFixed(3) + " h=" + zz.h.toFixed(3) + "  " + (zz.gh || "") + (zz.gv || ""));
                });
            } else {
                lines.push("宿主 " + code + " 无连字区");
            }
        }
        log.textContent = lines.join("\n") || "（无数据）";
    }

    // 3) 启动：先同步渲染一次，再异步等字形加载完重画
    try {
        MdCRndr.init({});
        MdCRndr.setQuadratMode("flow");
        renderNow();
    } catch (e) {
        log.textContent = "渲染失败：" + e.message;
    }

    (function boot() {
        if (typeof Glyphs === "undefined") { log.textContent += "\nGlyphs 未加载"; return; }
        Glyphs.setRenderer(MdCRndr);
        Glyphs.setEnabled(true);
        MdCRndr.setGlyphZoneProvider(function (c) { return Glyphs.zoneFor(c); });
        MdCRndr.setGlyphMetricsProvider(function (c) { return Glyphs.metrics(c); });
        MdCRndr.setGlyphBoxProvider(function (c) { return Glyphs.box(c); });
        MdCRndr.setGlyphAspectProvider(function (c) { return Glyphs.aspect(c); });
        var done = false;
        Glyphs.useSiteDir().then(function () {
            done = true;
            renderNow();
        }).catch(function (e) {
            log.textContent = "字形目录不可用：" + e.message;
        });
        // 兜底：2 秒后无论如何重画一次，避免一直显示"等待渲染"
        setTimeout(function () { if (!done) { try { renderNow(); } catch (e) { } } }, 2000);
    })();

    document.getElementById("go").addEventListener("click", renderNow);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") renderNow(); });
})();
</script>
</body>
</html>
